<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Pong Avançat</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(17, 24, 39, 0.9);
        --panel-border: rgba(148, 163, 184, 0.35);
        --text: #edf6ff;
        --muted: #a8bad4;
        --cyan: #67f3d8;
        --magenta: #ff7dcc;
        --gold: #ffd66b;
        --danger: #ff6b7d;
        --success: #79f2a5;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0; min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(103, 243, 216, 0.18), transparent 35%),
          radial-gradient(circle at bottom right, rgba(255, 125, 204, 0.18), transparent 30%),
          var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(980px, 100%);
      }

      .hud {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.2rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 .accent { color: var(--cyan); }

      .tag {
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(3, minmax(100px, 1fr));
        gap: 18px;
        margin-bottom: 18px;
      }

      .score-panel {
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        padding: 14px 16px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }

      .score-panel small {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .score-panel strong {
        display: block;
        margin-top: 6px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.1;
      }

      #playerScore { color: var(--cyan); }
      #cpuScore { color: var(--magenta); }
      #centerScore {
        color: var(--gold);
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }

      .court-wrap {
        position: relative;
        background: rgba(7, 11, 19, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0,0,0,0.45);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: linear-gradient(180deg, rgba(11,16,32,0.95), rgba(7,11,19,1));
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(3, 7, 18, 0.65);
        backdrop-filter: blur(4px);
        padding: 24px;
      }

      .overlay[hidden] { display: none; }

      .panel {
        width: min(500px, 100%);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 20px;
        padding: 28px 24px 20px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      }

      .panel h2 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .panel p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      .mode-select {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .mode-option,
      .primary-btn,
      .secondary-btn {
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 999px;
        padding: 10px 18px;
        color: var(--text);
        background: rgba(148, 163, 184, 0.08);
        cursor: pointer;
        font: inherit;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }

      .mode-option:hover,
      .primary-btn:hover,
      .secondary-btn:hover {
        transform: translateY(-1px);
      }

      .mode-option.active {
        border-color: rgba(103, 243, 216, 0.9);
        background: rgba(103, 243, 216, 0.12);
        box-shadow: 0 0 0 1px rgba(103, 243, 216, 0.2);
      }

      .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
      }

      .difficulty {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
      }

      .difficulty select {
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        padding: 9px 12px;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--cyan), #9ef1ea);
        color: #0b1020;
        border: none;
        font-weight: 700;
        box-shadow: 0 8px 26px rgba(103, 243, 216, 0.35);
      }

      .secondary-btn {
        background: rgba(255, 125, 204, 0.1);
      }

      .bottom-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        color: var(--muted);
        margin-top: 15px;
        font-size: 0.88rem;
      }

      .keys {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      kbd {
        border: 1px solid rgba(148, 163, 184, 0.5);
        border-bottom-width: 2px;
        border-radius: 7px;
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 4px 8px;
        font: inherit;
        font-size: 0.78rem;
      }

      @media (max-width: 700px) {
        body { padding: 16px; }
        .hud { align-items: center; }
        .tag { display: none; }
        .bottom-bar { flex-direction: column; align-items: flex-start; }
        .scoreboard { grid-template-columns: 1fr 60px 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="hud">
        <h1><span class="accent">P</span>ONG</h1>
        <div class="tag">Arcade • local • avançat</div>
      </div>

      <div class="scoreboard" aria-label="Marcador del joc">
        <div class="score-panel">
          <small>Tu</small>
          <strong id="playerScore">0</strong>
        </div>
        <div class="score-panel">
          <small>Objetiu</small>
          <strong id="centerScore">7</strong>
        </div>
        <div class="score-panel">
          <small>CPU</small>
          <strong id="cpuScore">0</strong>
        </div>
      </div>

      <div class="court-wrap">
        <canvas id="game" width="1000" height="560" aria-label="Pista de Pong"></canvas>

        <div class="overlay" id="overlay">
          <div class="panel" id="panel">
            <h2 id="overlayTitle">Pong Avançat</h2>
            <p id="overlayText">Selecciona el mode i comença la partida.</p>

            <div class="mode-select" aria-label="Modes de joc">
              <button class="mode-option active" data-mode="single" type="button">1 Jugador</button>
              <button class="mode-option" data-mode="dual" type="button">2 Jugadors</button>
            </div>

            <div class="controls-row">
              <div class="difficulty">
                <label for="difficulty">Dificultat</label>
                <select id="difficulty" aria-label="Dificultat del joc">
                  <option value="easy">Fàcil</option>
                  <option value="normal" selected>Normal</option>
                  <option value="hard">Difícil</option>
                </select>
              </div>

              <button id="startButton" class="primary-btn" type="button">Comença</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="keys">
          <span><kbd>W</kbd> / <kbd>S</kbd> moure</span>
          <span><kbd>↑</kbd> / <kbd>↓</kbd> segon jugador</span>
          <span><kbd>Espai</kbd> pausa</span>
        </div>
        <div>Primer a 7 punts</div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startButton = document.getElementById('startButton');
      const difficultySelect = document.getElementById('difficulty');
      const playerScoreEl = document.getElementById('playerScore');
      const cpuScoreEl = document.getElementById('cpuScore');
      const centerScoreEl = document.getElementById('centerScore');
      const modeButtons = [...document.querySelectorAll('.mode-option')];

      const W = canvas.width;
      const H = canvas.height;
      const winningScore = 7;

      const state = {
        mode: 'single',
        difficulty: 'normal',
        running: false,
        paused: false,
        ended: false,
        messageTimer: 0,
        lastTime: 0,
        raf: 0,
        flash: 0,
      };

      const controls = new Set();
      const trail = [];
      const particles = [];

      const paddleDefaults = {
        width: 16,
        height: 110,
        speed: 7,
      };

      const leftPaddle = { x: 44, y: H / 2 - paddleDefaults.height / 2, ...paddleDefaults };
      const rightPaddle = { x: W - 44 - paddleDefaults.width, y: H / 2 - paddleDefaults.height / 2, ...paddleDefaults };
      const ball = {
        x: W / 2,
        y: H / 2,
        r: 10,
        vx: 6,
        vy: 4,
      };

      const scores = { player: 0, cpu: 0 };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function updateScoreboard() {
        playerScoreEl.textContent = String(scores.player);
        cpuScoreEl.textContent = String(scores.cpu);
        centerScoreEl.textContent = String(winningScore);
      }

      function setMode(mode) {
        state.mode = mode;
        modeButtons.forEach(button => {
          button.classList.toggle('active', button.dataset.mode === mode);
        });
      }

      function setDifficulty(value) {
        state.difficulty = value;
      }

      function resetBall(direction = 1) {
        ball.x = W / 2;
        ball.y = H / 2;
        const baseSpeed = 6;
        const angle = (Math.random() * 2 - 1) * 1.1;
        ball.vx = direction * (baseSpeed + Math.random() * 0.8);
        ball.vy = angle * 4.2;
        trail.length = 0;
      }

      function resetPositions() {
        leftPaddle.y = H / 2 - leftPaddle.height / 2;
        rightPaddle.y = H / 2 - rightPaddle.height / 2;
        resetBall(Math.random() < 0.5 ? -1 : 1);
      }

      function createParticles(x, y, color, amount = 14) {
        for (let i = 0; i < amount; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            radius: Math.random() * 3 + 2,
            life: 50 + Math.random() * 25,
            color,
          });
        }
      }

      function playTone(freq, duration = 0.08, type = 'square', gainValue = 0.035) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!playTone.ctx) {
          playTone.ctx = new AudioCtx();
        }

        const ctxAudio = playTone.ctx;
        const oscillator = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();

        oscillator.type = type;
        oscillator.frequency.value = freq;
        gain.gain.value = gainValue;
        oscillator.connect(gain);
        gain.connect(ctxAudio.destination);

        const now = ctxAudio.currentTime;
        oscillator.start(now);
        gain.gain.setValueAtTime(gainValue, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        oscillator.stop(now + duration);
      }

      function triggerHitSound() {
        playTone(220, 0.04, 'square', 0.05);
      }

      function triggerScoreSound() {
        playTone(520, 0.12, 'triangle', 0.06);
      }

      function updatePaddles(dt) {
        const moveKey = (keyA, keyB) => {
          let amount = 0;
          if (controls.has(keyA)) amount -= 1;
          if (controls.has(keyB)) amount += 1;
          return amount;
        };

        const moveLeft = moveKey('w', 's') || moveKey('W', 'S');
        if (moveLeft) {
          leftPaddle.y += moveLeft * leftPaddle.speed * dt * 0.6;
        }

        if (state.mode === 'dual') {
          const moveRight = moveKey('ArrowUp', 'ArrowDown');
          if (moveRight) {
            rightPaddle.y += moveRight * rightPaddle.speed * dt * 0.6;
          }
        } else {
          const cpuBias = state.difficulty === 'easy' ? 0.72 : state.difficulty === 'hard' ? 1.24 : 1;
          const target = ball.y - rightPaddle.height / 2;
          const delta = target - rightPaddle.y;
          const cpuSpeed = (rightPaddle.speed * cpuBias * (state.difficulty === 'hard' ? 1.3 : 1)) * dt * 0.6;
          if (Math.abs(delta) > 5) {
            rightPaddle.y += clamp(delta, -cpuSpeed, cpuSpeed);
          }
        }

        leftPaddle.y = clamp(leftPaddle.y, 12, H - leftPaddle.height - 12);
        rightPaddle.y = clamp(rightPaddle.y, 12, H - rightPaddle.height - 12);
      }

      function handleWallCollision() {
        if (ball.y - ball.r <= 0 || ball.y + ball.r >= H) {
          ball.vy *= -1;
          ball.y = clamp(ball.y, ball.r, H - ball.r);
          playTone(140, 0.04, 'sawtooth', 0.025);
        }
      }

      function handlePaddleCollision(paddle, isLeft) {
        const paddleLeft = paddle.x;
        const paddleRight = paddle.x + paddle.width;
        const paddleTop = paddle.y;
        const paddleBottom = paddle.y + paddle.height;

        const hitsPaddle =
          ball.x + ball.r >= paddleLeft &&
          ball.x - ball.r <= paddleRight &&
          ball.y + ball.r >= paddleTop &&
          ball.y - ball.r <= paddleBottom;

        if (hitsPaddle) {
          const relativeHit = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
          const angle = relativeHit * 1.15;
          const speedBoost = 1.08 + (state.difficulty === 'hard' ? 0.12 : state.difficulty === 'easy' ? -0.04 : 0.04);
          const direction = isLeft ? 1 : -1;

          ball.x = isLeft ? paddle.x + paddle.width + ball.r : paddle.x - ball.r;
          ball.vx = direction * (Math.abs(ball.vx) * speedBoost + 0.8);
          ball.vy = angle * 6.8;
          triggerHitSound();
          createParticles(ball.x, ball.y, isLeft ? '#67f3d8' : '#ff7dcc', 12);
        }
      }

      function addPoint(side) {
        if (side === 'left') {
          scores.player += 1;
        } else {
          scores.cpu += 1;
        }

        triggerScoreSound();
        updateScoreboard();

        if (scores.player >= winningScore || scores.cpu >= winningScore) {
          endGame();
          return;
        }

        resetBall(side === 'left' ? 1 : -1);
      }

      function endGame() {
        state.running = false;
        state.ended = true;
        const playerWon = scores.player >= winningScore;
        overlayTitle.textContent = playerWon ? 'Has guanyat!' : 'La màquina ha guanyat';
        overlayText.textContent = `Resultat final: ${scores.player} - ${scores.cpu}.`;
        startButton.textContent = 'Torna a jugar';
        overlay.hidden = false;
      }

      function updateBall(dt) {
        ball.x += ball.vx * dt * 0.6;
        ball.y += ball.vy * dt * 0.6;

        handleWallCollision();
        handlePaddleCollision(leftPaddle, true);
        handlePaddleCollision(rightPaddle, false);

        if (ball.x < 0) addPoint('right');
        if (ball.x > W) addPoint('left');

        const historyMax = 18;
        trail.push({ x: ball.x, y: ball.y, alpha: 1 });
        if (trail.length > historyMax) trail.shift();
        trail.forEach((point, index) => {
          point.alpha = (index + 1) / trail.length;
        });
      }

      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 1;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function drawBackground() {
        ctx.fillStyle = '#070d19';
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < 42; i++) {
          const x = (i * 97) % W;
          const y = ((i * 53) % H) + (i % 3) * 20;
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          ctx.fillRect(x, y, 2, 2);
        }

        ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
        ctx.setLineDash([14, 14]);
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawTrail() {
        for (let i = 0; i < trail.length; i++) {
          const t = trail[i];
          ctx.beginPath();
          ctx.arc(t.x, t.y, (i / trail.length) * 8 + 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${Math.min(0.25, 0.02 + i / trail.length)})`;
          ctx.fill();
        }
      }

      function drawPaddles() {
        ctx.fillStyle = '#67f3d8';
        ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);

        ctx.fillStyle = '#ff7dcc';
        ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
      }

      function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fbff';
        ctx.fill();
      }

      function drawParticles() {
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color.replace(')', `, ${Math.max(0.2, p.life / 80)})`).replace('rgb', 'rgba');
          ctx.fill();
        });
      }

      function drawFlash() {
        if (state.flash > 0) {
          ctx.fillStyle = `rgba(255,255,255,${state.flash})`;
          ctx.fillRect(0, 0, W, H);
          state.flash *= 0.9;
        }
      }

      function render() {
        drawBackground();
        drawTrail();
        drawPaddles();
        drawBall();
        drawParticles();
        drawFlash();
      }

      function tick(now) {
        if (!state.running) {
          render();
          return;
        }

        const dt = Math.min((now - state.lastTime) / 16.67 || 1, 2.2);
        state.lastTime = now;
        if (!state.paused) {
          updatePaddles(dt);
          updateBall(dt);
          updateParticles();
        }
        render();
        state.raf = requestAnimationFrame(tick);
      }

      function startGame() {
        scores.player = 0;
        scores.cpu = 0;
        updateScoreboard();
        resetPositions();
        state.running = true;
        state.paused = false;
        state.ended = false;
        state.flash = 0.22;
        overlay.hidden = true;
        startButton.textContent = 'Juga';
        state.lastTime = performance.now();
        cancelAnimationFrame(state.raf);
        state.raf = requestAnimationFrame(tick);
      }

      function togglePause() {
        if (!state.running || state.ended) return;
        state.paused = !state.paused;
        if (state.paused) {
          overlayTitle.textContent = 'Pausa';
          overlayText.textContent = 'Prem Espai per continuar la partida.';
          startButton.textContent = 'Continuar';
          overlay.hidden = false;
        } else {
          overlay.hidden = true;
          state.lastTime = performance.now();
        }
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key;
        if ([' ', 'ArrowUp', 'ArrowDown', 'w', 'W', 's', 'S'].includes(key)) {
          event.preventDefault();
        }
        controls.add(key);

        if (key === ' ' && !state.running) {
          startGame();
        } else if (key === ' ') {
          togglePause();
        }
      });

      document.addEventListener('keyup', (event) => {
        controls.delete(event.key);
      });

      window.addEventListener('blur', () => {
        controls.clear();
        if (state.running && !state.ended && !state.paused) {
          togglePause();
        }
      });

      startButton.addEventListener('click', () => {
        if (state.paused && state.running) {
          togglePause();
        } else {
          startGame();
        }
      });

      modeButtons.forEach(button => {
        button.addEventListener('click', () => setMode(button.dataset.mode));
      });

      difficultySelect.addEventListener('change', (event) => {
        setDifficulty(event.target.value);
      });

      canvas.addEventListener('pointerdown', (event) => {
        if (!state.running) return;
        const rect = canvas.getBoundingClientRect();
        const y = ((event.clientY - rect.top) / rect.height) * H;
        if (state.mode === 'single') {
          leftPaddle.y = clamp(y - leftPaddle.height / 2, 12, H - leftPaddle.height - 12);
        } else {
          leftPaddle.y = clamp(y - leftPaddle.height / 2, 12, H - leftPaddle.height - 12);
        }
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!state.running || state.mode !== 'single') return;
        const rect = canvas.getBoundingClientRect();
        const y = ((event.clientY - rect.top) / rect.height) * H;
        leftPaddle.y = clamp(y - leftPaddle.height / 2, 12, H - leftPaddle.height - 12);
      });

      setMode('single');
      setDifficulty('normal');
      updateScoreboard();
      render();
    </script>
  </body>
</html>
