<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Pong — Joc clàssic</title>
  <style>
    :root { color-scheme: dark; --bg:#10131c; --panel:#191e2b; --line:#30394a; --text:#f4f7ff; --muted:#9aa7bb; --cyan:#65f4dc; --pink:#ff6fae; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 0%, #20283a 0, var(--bg) 62%); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(900px,100%); }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin:0 0 16px; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3rem); letter-spacing:.12em; }
    h1 span { color:var(--cyan); }
    .tag { color:var(--muted); font-size:.85rem; }
    .scoreboard { display:flex; justify-content:center; align-items:center; gap:clamp(24px,10vw,90px); padding:16px; margin-bottom:12px; border:1px solid var(--line); border-radius:14px; background:rgba(25,30,43,.85); }
    .score { min-width:90px; text-align:center; }
    .score small { display:block; color:var(--muted); font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; }
    .score strong { display:block; font-size:2rem; line-height:1.15; }
    #playerScore { color:var(--cyan); } #cpuScore { color:var(--pink); }
    .court-wrap { position:relative; overflow:hidden; border:1px solid #394355; border-radius:16px; background:#0b0e15; box-shadow:0 24px 70px #0008; }
    canvas { display:block; width:100%; height:auto; aspect-ratio: 800 / 450; touch-action:none; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:20px; background:#080b12b8; text-align:center; }
    .overlay[hidden] { display:none; }
    .overlay-card { max-width:440px; }
    .overlay h2 { margin:0 0 8px; font-size:clamp(1.5rem,5vw,2.4rem); }
    .overlay p { margin:0 0 20px; color:#c1cada; }
    button { border:0; border-radius:999px; padding:12px 24px; background:var(--cyan); color:#071512; font:700 1rem inherit; cursor:pointer; box-shadow:0 5px 22px #65f4dc33; }
    button:hover { filter:brightness(1.08); } button:focus-visible { outline:3px solid white; outline-offset:3px; }
    .below { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; color:var(--muted); font-size:.88rem; }
    .controls { display:flex; flex-wrap:wrap; gap:8px 18px; }
    kbd { border:1px solid #465064; border-radius:5px; padding:2px 6px; color:var(--text); background:#202635; font:inherit; font-size:.78rem; }
    .mobile-hint { display:none; }
    @media(max-width:600px) { body{padding:16px;} header{align-items:center;} .tag{display:none;} .below{align-items:flex-start; flex-direction:column;} .mobile-hint{display:block;} }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main>
    <header><h1><span>P</span>ONG</h1><div class="tag">Un clàssic, ara a la teva pantalla.</div></header>
    <section class="scoreboard" aria-label="Marcador">
      <div class="score"><small>Tu</small><strong id="playerScore">0</strong></div>
      <div class="score"><small>Primer a 7</small><strong aria-hidden="true">:</strong></div>
      <div class="score"><small>Màquina</small><strong id="cpuScore">0</strong></div>
    </section>
    <div class="court-wrap">
      <canvas id="game" width="800" height="450" aria-label="Pista de Pong. Mou la raqueta amb W i S o amb les fletxes amunt i avall."></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card"><h2 id="message">A punt per jugar?</h2><p id="submessage">Tu contra la màquina. Qui arriba primer a 7?</p><button id="startButton" type="button">Comença el joc</button></div>
      </div>
    </div>
    <div class="below"><div class="controls"><span><kbd>W</kbd> / <kbd>S</kbd> moure</span><span><kbd>↑</kbd> / <kbd>↓</kbd> també</span><span><kbd>Espai</kbd> pausa</span></div><span class="mobile-hint">Al mòbil, arrossega el dit per moure la raqueta.</span><span>Primer a 7 punts</span></div>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const overlay = document.querySelector('#overlay');
      const message = document.querySelector('#message');
      const submessage = document.querySelector('#submessage');
      const startButton = document.querySelector('#startButton');
      const playerScoreEl = document.querySelector('#playerScore');
      const cpuScoreEl = document.querySelector('#cpuScore');
      const W = canvas.width, H = canvas.height;
      const paddle = { w:12, h:86, speed:7 };
      const player = { x:28, y:H/2-paddle.h/2, score:0 };
      const cpu = { x:W-40, y:H/2-paddle.h/2, score:0 };
      const ball = { x:W/2, y:H/2, r:8, vx:5, vy:2.5 };
      const keys = new Set();
      let running = false, paused = false, lastTime = 0, raf = 0;
      const clamp = (v,min,max) => Math.max(min, Math.min(max,v));

      function draw() {
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle = '#0b0e15'; ctx.fillRect(0,0,W,H);
        ctx.setLineDash([9,12]); ctx.strokeStyle = '#293244'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#65f4dc'; ctx.fillRect(player.x,player.y,paddle.w,paddle.h);
        ctx.fillStyle = '#ff6fae'; ctx.fillRect(cpu.x,cpu.y,paddle.w,paddle.h);
        ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fillStyle='#f4f7ff'; ctx.fill();
        ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r*2.1,0,Math.PI*2); ctx.fillStyle='#f4f7ff20'; ctx.fill();
      }
      function resetBall(direction) {
        ball.x=W/2; ball.y=H/2;
        const speed=5.2;
        ball.vx=speed*direction;
        ball.vy=(Math.random()*3-1.5) || 1;
      }
      function update(dt) {
        const step=dt/16.67;
        if(keys.has('ArrowUp')||keys.has('w')||keys.has('W')) player.y-=paddle.speed*step;
        if(keys.has('ArrowDown')||keys.has('s')||keys.has('S')) player.y+=paddle.speed*step;
        player.y=clamp(player.y,0,H-paddle.h);
        const cpuTarget=ball.y-paddle.h/2;
        const cpuSpeed=4.2*step;
        cpu.y+=clamp(cpuTarget-cpu.y,-cpuSpeed,cpuSpeed);
        cpu.y=clamp(cpu.y,0,H-paddle.h);
        ball.x+=ball.vx*step; ball.y+=ball.vy*step;
        if(ball.y-ball.r<0 || ball.y+ball.r>H) ball.vy*=-1;
        if(ball.vx<0 && ball.x-ball.r<player.x+paddle.w && ball.x>player.x && ball.y+ball.r>player.y && ball.y-ball.r<player.y+paddle.h) {
          ball.x=player.x+paddle.w+ball.r;
          ball.vx=Math.abs(ball.vx)*1.045;
          ball.vy=((ball.y-(player.y+paddle.h/2))/(paddle.h/2))*5;
        }
        if(ball.vx>0 && ball.x+ball.r>cpu.x && ball.x<cpu.x+paddle.w && ball.y+ball.r>cpu.y && ball.y-ball.r<cpu.y+paddle.h) {
          ball.x=cpu.x-ball.r;
          ball.vx=-Math.abs(ball.vx)*1.035;
          ball.vy=((ball.y-(cpu.y+paddle.h/2))/(paddle.h/2))*4.5;
        }
        if(ball.x<0) { cpu.score++; updateScore(); point(1); }
        if(ball.x>W) { player.score++; updateScore(); point(-1); }
      }
      function updateScore(){ playerScoreEl.textContent=player.score; cpuScoreEl.textContent=cpu.score; }
      function point(direction) {
        if(player.score>=7 || cpu.score>=7) {
          running=false;
          message.textContent=player.score>=7?'Has guanyat!':'La màquina ha guanyat';
          submessage.textContent=`Resultat final: ${player.score} — ${cpu.score}.`;
          startButton.textContent='Torna-hi'; overlay.hidden=false;
          return;
        }
        resetBall(direction);
      }
      function loop(now) {
        if(!running) return;
        const dt=Math.min(now-lastTime,32); lastTime=now;
        if(!paused) update(dt);
        draw(); raf=requestAnimationFrame(loop);
      }
      function start() {
        if(player.score>=7 || cpu.score>=7) { player.score=0; cpu.score=0; updateScore(); }
        overlay.hidden=true; paused=false; running=true;
        resetBall(Math.random()<.5?1:-1); lastTime=performance.now();
        cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
      }
      function togglePause() {
        if(!running) return;
        paused=!paused;
        if(paused) { message.textContent='Partida en pausa'; submessage.textContent='Prem Espai per continuar.'; startButton.textContent='Continua'; overlay.hidden=false; }
        else { overlay.hidden=true; lastTime=performance.now(); }
      }
      startButton.addEventListener('click',()=>{ if(running&&paused){paused=false;overlay.hidden=true;lastTime=performance.now();}else start(); });
      window.addEventListener('keydown',e=>{
        if(['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
        keys.add(e.key);
        if(e.key===' '){ if(!running) start(); else togglePause(); }
      });
      window.addEventListener('keyup',e=>keys.delete(e.key));
      window.addEventListener('blur',()=>keys.clear());
      function moveToPointer(e){ const rect=canvas.getBoundingClientRect(); player.y=clamp((e.clientY-rect.top)*(H/rect.height)-paddle.h/2,0,H-paddle.h); }
      canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);moveToPointer(e);});
      canvas.addEventListener('pointermove',e=>{if(e.buttons)moveToPointer(e);});
      draw();
    })();
  </script>
</body>
</html>
